<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake - 15 niveles</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 15px;
    background: #101820;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

h1 {
    color: #62e879;
    margin: 10px 0 15px;
}

#game-container {
    width: 100%;
    max-width: 620px;
    margin: auto;
}

#info {
    display: flex;
    justify-content: space-around;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 12px;
    font-size: 17px;
    font-weight: bold;
}

#game {
    display: block;
    width: 100%;
    max-width: 600px;
    height: auto;
    margin: auto;
    background: #17232d;
    border: 3px solid #62e879;
    border-radius: 8px;
    touch-action: none;
}

#message {
    min-height: 55px;
    margin: 12px 0;
    font-size: 19px;
    font-weight: bold;
    color: #62e879;
}

button {
    border: none;
    border-radius: 8px;
    padding: 12px 20px;
    margin: 5px;
    background: #62e879;
    color: #102018;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #42c95c;
}

#controls {
    margin-top: 15px;
    display: grid;
    grid-template-columns: repeat(3, 65px);
    justify-content: center;
    gap: 7px;
}

#controls button {
    width: 65px;
    height: 55px;
    margin: 0;
    padding: 0;
    font-size: 23px;
}

.empty {
    visibility: hidden;
}

#instructions {
    color: #c7d3dc;
    font-size: 13px;
    margin-top: 15px;
    line-height: 1.5;
}
</style>
</head>

<body>

<div id="game-container">

<h1>🐍 SNAKE</h1>

<div id="info">
    <span>Puntos: <span id="score">0</span></span>
    <span>Nivel: <span id="level">1</span>/15</span>
    <span>Récord: <span id="record">0</span></span>
</div>

<canvas id="game" width="600" height="600"></canvas>

<div id="message">Pulsa «Nueva partida» para empezar</div>

<div>
    <button onclick="startGame()">Nueva partida</button>
    <button onclick="togglePause()">Pausar / Reanudar</button>
</div>

<div id="controls">
    <button class="empty"></button>
    <button onclick="changeDirection('up')">▲</button>
    <button class="empty"></button>

    <button onclick="changeDirection('left')">◀</button>
    <button onclick="changeDirection('down')">▼</button>
    <button onclick="changeDirection('right')">▶</button>
</div>

<div id="instructions">
    Ordenador: utiliza las flechas o WASD para moverte.<br>
    Pulsa ESPACIO o P para pausar y reanudar.<br>
    Móvil: utiliza los botones o desliza el dedo sobre el tablero.<br>
    Come manzanas, evita las minas y los obstáculos.
</div>

</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const SIZE = 20;
const CELL = canvas.width / SIZE;

// VELOCIDAD
// Todas las partidas comienzan siempre a 460 ms.
// Cada nivel reduce el intervalo solo 3 ms.
const INITIAL_SPEED = 460;
const SPEED_INCREASE = 3;
const MINIMUM_SPEED = 300;

function speedForLevel(level) {
    return Math.max(
        MINIMUM_SPEED,
        INITIAL_SPEED - ((level - 1) * SPEED_INCREASE)
    );
}

let snake;
let direction;
let nextDirection;
let food;
let mines = [];
let obstacles = [];

let score = 0;
let level = 1;
let record = Number(localStorage.getItem("snakeRecord")) || 0;

let gameInterval = null;
let obstacleInterval = null;

let running = false;
let paused = false;
let gameOver = false;

document.getElementById("record").textContent = record;

function randomCell() {
    return {
        x: Math.floor(Math.random() * SIZE),
        y: Math.floor(Math.random() * SIZE)
    };
}

function samePosition(a, b) {
    return a.x === b.x && a.y === b.y;
}

function isOccupied(position) {
    if (snake && snake.some(part => samePosition(part, position))) {
        return true;
    }

    if (food && samePosition(food, position)) {
        return true;
    }

    if (mines.some(mine => samePosition(mine, position))) {
        return true;
    }

    if (obstacles.some(obstacle =>
        obstacle.cells.some(cell => samePosition(cell, position))
    )) {
        return true;
    }

    return false;
}

function randomFreeCell() {
    let position;
    let attempts = 0;

    do {
        position = randomCell();
        attempts++;
    } while (isOccupied(position) && attempts < 1000);

    return position;
}

function createFood() {
    food = randomFreeCell();
}

function createMines() {
    mines = [];

    if (level < 5) return;

    const numberOfMines = Math.min(
        1 + Math.floor((level - 5) / 2),
        6
    );

    for (let i = 0; i < numberOfMines; i++) {
        mines.push(randomFreeCell());
    }
}

function updateInterface() {
    document.getElementById("score").textContent = score;
    document.getElementById("level").textContent = level;
    document.getElementById("record").textContent = record;
}

function startGame() {
    // Detener cualquier temporizador de la partida anterior.
    clearInterval(gameInterval);
    clearInterval(obstacleInterval);

    // IMPORTANTE:
    // Reiniciamos completamente la partida.
    // La velocidad vuelve SIEMPRE a la inicial.
    score = 0;
    level = 1;

    snake = [
        { x: 10, y: 10 },
        { x: 9, y: 10 },
        { x: 8, y: 10 }
    ];

    direction = "right";
    nextDirection = "right";

    mines = [];
    obstacles = [];

    running = true;
    paused = false;
    gameOver = false;

    createFood();
    createMines();
    updateInterface();

    document.getElementById("message").textContent =
        "¡Buena suerte! Nivel 1";

    // Siempre comienza con INITIAL_SPEED.
    startGameInterval();

    // Actualiza la caducidad de los obstáculos.
    obstacleInterval = setInterval(() => {
        if (!running || paused) return;

        const now = Date.now();
        obstacles = obstacles.filter(
            obstacle => obstacle.expiresAt > now
        );

        draw();
    }, 200);

    draw();
}

function startGameInterval() {
    clearInterval(gameInterval);

    // La velocidad depende únicamente del nivel actual.
    // Nunca se modifica ni se acumula al empezar otra partida.
    const currentSpeed = speedForLevel(level);

    gameInterval = setInterval(gameLoop, currentSpeed);
}

function togglePause() {
    if (!running || gameOver) return;

    paused = !paused;

    document.getElementById("message").textContent =
        paused ? "⏸ PARTIDA EN PAUSA" : "¡Continúa!";

    draw();
}

function changeDirection(newDirection) {
    if (!running || paused || gameOver) return;

    const opposites = {
        up: "down",
        down: "up",
        left: "right",
        right: "left"
    };

    if (opposites[newDirection] === direction) return;

    nextDirection = newDirection;
}

document.addEventListener("keydown", function(event) {
    const key = event.key.toLowerCase();

    if ([
        "arrowup", "arrowdown", "arrowleft", "arrowright", " "
    ].includes(key)) {
        event.preventDefault();
    }

    if (key === "arrowup" || key === "w") {
        changeDirection("up");
    }

    if (key === "arrowdown" || key === "s") {
        changeDirection("down");
    }

    if (key === "arrowleft" || key === "a") {
        changeDirection("left");
    }

    if (key === "arrowright" || key === "d") {
        changeDirection("right");
    }

    if (key === " " || key === "p") {
        togglePause();
    }
});

function gameLoop() {
    if (!running || paused || gameOver) return;

    direction = nextDirection;

    const head = { ...snake[0] };

    if (direction === "up") head.y--;
    if (direction === "down") head.y++;
    if (direction === "left") head.x--;
    if (direction === "right") head.x++;

    // Chocar contra los bordes.
    if (
        head.x < 0 || head.x >= SIZE ||
        head.y < 0 || head.y >= SIZE
    ) {
        endGame("¡Has chocado contra la pared!");
        return;
    }

    // Chocar contra el propio cuerpo.
    const eating = samePosition(head, food);

    const bodyToCheck = eating ? snake : snake.slice(0, -1);

    if (bodyToCheck.some(part => samePosition(part, head))) {
        endGame("¡Te has chocado contigo mismo!");
        return;
    }

    // Chocar contra una mina.
    if (mines.some(mine => samePosition(mine, head))) {
        endGame("💣 ¡Has tocado una mina!");
        return;
    }

    // Eliminar obstáculos caducados.
    const now = Date.now();

    obstacles = obstacles.filter(
        obstacle => obstacle.expiresAt > now
    );

    // Chocar contra obstáculos.
    for (const obstacle of obstacles) {
        if (obstacle.cells.some(cell => samePosition(cell, head))) {
            endGame("¡Has chocado contra un obstáculo!");
            return;
        }
    }

    snake.unshift(head);

    if (eating) {
        score++;
        updateRecord();

        // Cada manzana vale un punto.
        // Cada 50 puntos se supera un nivel.
        if (score >= 750) {
            winGame();
            return;
        }

        const newLevel = Math.floor(score / 50) + 1;

        if (newLevel > level) {
            level = newLevel;
            createMines();
            updateInterface();

            document.getElementById("message").textContent =
                "🎉 ¡NIVEL " + level + " SUPERADO!";

            // La velocidad solo cambia al subir de nivel.
            startGameInterval();
        }

        createFood();

        // Obstáculos temporales desde el nivel 10.
        if (level >= 10 && Math.random() < 0.30) {
            createObstacle();
        }

    } else {
        snake.pop();
    }

    updateInterface();
    draw();
}

function updateRecord() {
    if (score > record) {
        record = score;
        localStorage.setItem("snakeRecord", record);
        document.getElementById("record").textContent = record;
    }
}

function createObstacle() {
    const horizontal = Math.random() < 0.5;
    const length = 3 + Math.floor(Math.random() * 4);

    const start = randomFreeCell();
    const cells = [];

    for (let i = 0; i < length; i++) {
        const cell = {
            x: start.x + (horizontal ? i : 0),
            y: start.y + (horizontal ? 0 : i)
        };

        if (
            cell.x >= SIZE || cell.y >= SIZE ||
            isOccupied(cell)
        ) {
            return;
        }

        cells.push(cell);
    }

    const duration = 5000 + Math.random() * 3000;

    obstacles.push({
        cells: cells,
        expiresAt: Date.now() + duration
    });
}

function endGame(message) {
    running = false;
    gameOver = true;

    clearInterval(gameInterval);
    clearInterval(obstacleInterval);

    document.getElementById("message").textContent =
        message + " Puntuación: " + score;

    draw();
}

function winGame() {
    running = false;
    gameOver = true;

    clearInterval(gameInterval);
    clearInterval(obstacleInterval);

    document.getElementById("message").innerHTML =
        "🏆 ¡ENHORABUENA!<br>" +
        "LOGRO DESBLOQUEADO<br>" +
        "¡Has completado los 15 niveles!";

    draw();
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Fondo.
    ctx.fillStyle = "#17232d";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Cuadrícula.
    ctx.strokeStyle = "#243541";
    ctx.lineWidth = 1;

    for (let i = 0; i <= SIZE; i++) {
        ctx.beginPath();
        ctx.moveTo(i * CELL, 0);
        ctx.lineTo(i * CELL, canvas.height);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(0, i * CELL);
        ctx.lineTo(canvas.width, i * CELL);
        ctx.stroke();
    }

    // Manzana.
    if (food) {
        ctx.fillStyle = "#ff4141";
        ctx.beginPath();
        ctx.arc(
            food.x * CELL + CELL / 2,
            food.y * CELL + CELL / 2,
            CELL * 0.38,
            0,
            Math.PI * 2
        );
        ctx.fill();

        ctx.fillStyle = "#62e879";
        ctx.fillRect(
            food.x * CELL + CELL / 2 - 2,
            food.y * CELL + 2,
            4,
            7
        );
    }

    // Minas.
    mines.forEach(mine => {
        ctx.fillStyle = "#050505";
        ctx.beginPath();
        ctx.arc(
            mine.x * CELL + CELL / 2,
            mine.y * CELL + CELL / 2,
            CELL * 0.38,
            0,
            Math.PI * 2
        );
        ctx.fill();

        ctx.strokeStyle = "#777";
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.fillStyle = "white";
        ctx.font = "15px Arial";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(
            "✹",
            mine.x * CELL + CELL / 2,
            mine.y * CELL + CELL / 2
        );
    });

    // Obstáculos temporales.
    obstacles.forEach(obstacle => {
        obstacle.cells.forEach(cell => {
            ctx.fillStyle = "#b15cff";
            ctx.fillRect(
                cell.x * CELL + 2,
                cell.y * CELL + 2,
                CELL - 4,
                CELL - 4
            );
        });
    });

    // Serpiente.
    snake.forEach((part, index) => {
        ctx.fillStyle = index === 0 ? "#a0ffad" : "#39c85a";

        ctx.fillRect(
            part.x * CELL + 2,
            part.y * CELL + 2,
            CELL - 4,
            CELL - 4
        );

        ctx.strokeStyle = "#173c24";
        ctx.strokeRect(
            part.x * CELL + 2,
            part.y * CELL + 2,
            CELL - 4,
            CELL - 4
        );
    });

    // Pantalla de pausa.
    if (paused) {
        ctx.fillStyle = "rgba(0,0,0,0.65)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "white";
        ctx.font = "bold 42px Arial";
        ctx.textAlign = "center";
        ctx.fillText(
            "PAUSA",
            canvas.width / 2,
            canvas.height / 2
        );
    }
}

// Controles táctiles mediante deslizamiento.
let touchStartX = 0;
let touchStartY = 0;

canvas.addEventListener("touchstart", function(event) {
    const touch = event.changedTouches[0];

    touchStartX = touch.clientX;
    touchStartY = touch.clientY;
}, { passive: true });

canvas.addEventListener("touchend", function(event) {
    const touch = event.changedTouches[0];

    const dx = touch.clientX - touchStartX;
    const dy = touch.clientY - touchStartY;

    if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;

    if (Math.abs(dx) > Math.abs(dy)) {
        changeDirection(dx > 0 ? "right" : "left");
    } else {
        changeDirection(dy > 0 ? "down" : "up");
    }
}, { passive: true });

// Dibujar pantalla inicial.
snake = [
    { x: 10, y: 10 },
    { x: 9, y: 10 },
    { x: 8, y: 10 }
];

direction = "right";
nextDirection = "right";
food = { x: 14, y: 10 };

updateInterface();
draw();

</script>

</body>
</html>
