<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake - 15 niveles</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 15px;
    background: #101820;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

h1 {
    color: #62e879;
    margin: 10px 0 15px;
}

#game-container {
    width: 100%;
    max-width: 620px;
    margin: auto;
}

#info {
    display: flex;
    justify-content: space-around;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 12px;
    font-size: 17px;
    font-weight: bold;
}

#game {
    display: block;
    width: 100%;
    max-width: 600px;
    height: auto;
    margin: auto;
    background: #17232d;
    border: 3px solid #62e879;
    border-radius: 8px;
    touch-action: none;
}

#message {
    min-height: 55px;
    margin: 12px 0;
    font-size: 19px;
    font-weight: bold;
    color: #62e879;
}

button {
    border: none;
    border-radius: 8px;
    padding: 12px 20px;
    margin: 5px;
    background: #62e879;
    color: #102018;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #42c95c;
}

#controls {
    margin-top: 15px;
    display: grid;
    grid-template-columns: repeat(3, 65px);
    justify-content: center;
    gap: 7px;
}

#controls button {
    width: 65px;
    height: 55px;
    margin: 0;
    padding: 0;
    font-size: 23px;
}

.empty {
    visibility: hidden;
}

#instructions {
    color: #c7d3dc;
    font-size: 13px;
    margin-top: 15px;
    line-height: 1.5;
}
</style>
</head>

<body>

<div id="game-container">

<h1>🐍 SNAKE</h1>

<div id="info">
    <span>Puntos: <span id="score">0</span></span>
    <span>Nivel: <span id="level">1</span>/15</span>
    <span>Récord: <span id="record">0</span></span>
</div>

<canvas id="game" width="600" height="600"></canvas>

<div id="message">Pulsa «Nueva partida» para empezar</div>

<div>
    <button onclick="startGame()">Nueva partida</button>
    <button onclick="togglePause()">Pausar / Reanudar</button>
</div>

<div id="controls">
    <button class="empty"></button>
    <button onclick="changeDirection('up')">▲</button>
    <button class="empty"></button>

    <button onclick="changeDirection('left')">◀</button>
    <button onclick="changeDirection('down')">▼</button>
    <button onclick="changeDirection('right')">▶</button>
</div>

<div id="instructions">
    Ordenador: utiliza las flechas o WASD para moverte.<br>
    Pulsa ESPACIO o P para pausar y reanudar.<br>
    Móvil: utiliza los botones o desliza el dedo sobre el tablero.<br>
    Come manzanas, evita las minas y los obstáculos.
</div>

</div>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const SIZE = 20;
const CELL = canvas.width / SIZE;

// CONFIGURACIÓN DE VELOCIDAD
const INITIAL_SPEED = 230;
const SPEED_INCREASE = 3;
const MINIMUM_SPEED = 150;

// Aumento del 0,5 % cada 5 puntos.
const SPEED_INCREASE_PER_5_POINTS = 0.005;

function speedForLevel(level) {
    return Math.max(
        MINIMUM_SPEED,
        INITIAL_SPEED - ((level - 1) * SPEED_INCREASE)
    );
}

// VARIABLES DEL JUEGO

let snake;
let direction;
let nextDirection;
let food;

let mines = [];
let obstacles = [];

let score = 0;

// El nivel desbloqueado se conserva entre partidas.
let level = Number(
    localStorage.getItem("snakeUnlockedLevel")
) || 1;

level = Math.min(Math.max(level, 1), 15);

// Récord.
let record = Number(
    localStorage.getItem("snakeRecord")
) || 0;

// Estado de la partida.
let gameInterval = null;
let obstacleInterval = null;

let running = false;
let paused = false;
let gameOver = false;

// Comprobar si ya se completaron los 15 niveles.
let campaignComplete =
    localStorage.getItem("snakeCampaignComplete") === "true";

document.getElementById("record").textContent = record;
document.getElementById("level").textContent = level;


// FUNCIONES GENERALES

function randomCell() {
    return {
        x: Math.floor(Math.random() * SIZE),
        y: Math.floor(Math.random() * SIZE)
    };
}

function samePosition(a, b) {
    return a.x === b.x && a.y === b.y;
}

function isOccupied(position) {
    if (snake && snake.some(part =>
        samePosition(part, position)
    )) {
        return true;
    }

    if (food && samePosition(food, position)) {
        return true;
    }

    if (mines.some(mine =>
        samePosition(mine, position)
    )) {
        return true;
    }

    if (obstacles.some(obstacle =>
        obstacle.cells.some(cell =>
            samePosition(cell, position)
        )
    )) {
        return true;
    }

    return false;
}

function randomFreeCell() {
    let position;
    let attempts = 0;

    do {
        position = randomCell();
        attempts++;
    } while (
        isOccupied(position) &&
        attempts < 1000
    );

    return position;
}


// COMIDA

function createFood() {
    food = randomFreeCell();
}


// MINAS

function createMines() {
    mines = [];

    if (level < 5) return;

    const numberOfMines = Math.min(
        1 + Math.floor((level - 5) / 2),
        6
    );

    for (let i = 0; i < numberOfMines; i++) {
        mines.push(randomFreeCell());
    }
}


// INTERFAZ

function updateInterface() {
    document.getElementById("score").textContent = score;
    document.getElementById("level").textContent = level;
    document.getElementById("record").textContent = record;
}


// INICIAR NUEVA PARTIDA

function startGame() {

    // Si ya se han completado los 15 niveles,
    // no se puede iniciar otra partida.
    if (campaignComplete) {
        document.getElementById("message").textContent =
            "🏆 ¡Has completado los 15 niveles! LOGRO DESBLOQUEADO";
        return;
    }

    clearInterval(gameInterval);
    clearInterval(obstacleInterval);

    // Recuperar el siguiente nivel desbloqueado.
    level = Number(
        localStorage.getItem("snakeUnlockedLevel")
    ) || 1;

    level = Math.min(Math.max(level, 1), 15);

    // Cada partida comienza siempre desde 0 puntos.
    score = 0;

    snake = [
        { x: 10, y: 10 },
        { x: 9, y: 10 },
        { x: 8, y: 10 }
    ];

    direction = "right";
    nextDirection = "right";

    mines = [];
    obstacles = [];

    running = true;
    paused = false;
    gameOver = false;

    createFood();
    createMines();

    updateInterface();

    document.getElementById("message").textContent =
        "¡Nivel " + level + "! Consigue 50 puntos para completarlo.";

    // La velocidad inicial depende del nivel.
    // El aumento dentro del nivel comienza desde cero.
    startGameInterval();

    // Control de caducidad de obstáculos.
    obstacleInterval = setInterval(() => {

        if (!running || paused) return;

        const now = Date.now();

        obstacles = obstacles.filter(
            obstacle => obstacle.expiresAt > now
        );

        draw();

    }, 200);

    draw();
}


// CONTROL DE VELOCIDAD

function startGameInterval() {

    clearInterval(gameInterval);

    // Puntos conseguidos dentro de esta partida.
    const speedBoost = Math.floor(score / 5);

    // Cada 5 puntos la serpiente es un 0,5 % más rápida.
    const currentSpeed = Math.max(
        MINIMUM_SPEED,
        speedForLevel(level) /
        Math.pow(
            1 + SPEED_INCREASE_PER_5_POINTS,
            speedBoost
        )
    );

    gameInterval = setInterval(
        gameLoop,
        currentSpeed
    );
}


// PAUSA

function togglePause() {

    if (!running || gameOver) return;

    paused = !paused;

    document.getElementById("message").textContent =
        paused ? "⏸ PARTIDA EN PAUSA" : "¡Continúa!";

    draw();
}


// DIRECCIÓN

function changeDirection(newDirection) {

    if (!running || paused || gameOver) return;

    const opposites = {
        up: "down",
        down: "up",
        left: "right",
        right: "left"
    };

    if (opposites[newDirection] === direction) return;

    nextDirection = newDirection;
}


// TECLADO

document.addEventListener("keydown", function(event) {

    const key = event.key.toLowerCase();

    if ([
        "arrowup",
        "arrowdown",
        "arrowleft",
        "arrowright",
        " "
    ].includes(key)) {
        event.preventDefault();
    }

    if (key === "arrowup" || key === "w") {
        changeDirection("up");
    }

    if (key === "arrowdown" || key === "s") {
        changeDirection("down");
    }

    if (key === "arrowleft" || key === "a") {
        changeDirection("left");
    }

    if (key === "arrowright" || key === "d") {
        changeDirection("right");
    }

    if (key === " " || key === "p") {
        togglePause();
    }

});


// BUCLE PRINCIPAL

function gameLoop() {

    if (!running || paused || gameOver) return;

    direction = nextDirection;

    const head = { ...snake[0] };

    if (direction === "up") head.y--;
    if (direction === "down") head.y++;
    if (direction === "left") head.x--;
    if (direction === "right") head.x++;

    // COLISIÓN CON LOS BORDES

    if (
        head.x < 0 ||
        head.x >= SIZE ||
        head.y < 0 ||
        head.y >= SIZE
    ) {
        endGame("¡Has chocado contra la pared!");
        return;
    }

    // COLISIÓN CON EL PROPIO CUERPO

    const eating = samePosition(head, food);

    const bodyToCheck = eating
        ? snake
        : snake.slice(0, -1);

    if (bodyToCheck.some(part =>
        samePosition(part, head)
    )) {
        endGame("¡Te has chocado contigo mismo!");
        return;
    }

    // COLISIÓN CON MINAS

    if (mines.some(mine =>
        samePosition(mine, head)
    )) {
        endGame("💣 ¡Has tocado una mina!");
        return;
    }

    // ELIMINAR OBSTÁCULOS CADUCADOS

    const now = Date.now();

    obstacles = obstacles.filter(
        obstacle => obstacle.expiresAt > now
    );

    // COLISIÓN CON OBSTÁCULOS

    for (const obstacle of obstacles) {

        if (obstacle.cells.some(cell =>
            samePosition(cell, head)
        )) {
            endGame("¡Has chocado contra un obstáculo!");
            return;
        }

    }

    snake.unshift(head);

    // COMER MANZANA

    if (eating) {

        score++;

        updateRecord();

        updateInterface();

        // COMPLETAR EL NIVEL AL LLEGAR A 50 PUNTOS.

        if (score >= 50) {
            completeLevel();
            return;
        }

        // Cada 5 puntos se recalcula la velocidad.
        if (score % 5 === 0) {
            startGameInterval();
        }

        createFood();

        // OBSTÁCULOS DESDE EL NIVEL 10.

        if (
            level >= 10 &&
            Math.random() < 0.30
        ) {
            createObstacle();
        }

    } else {

        snake.pop();

    }

    updateInterface();
    draw();

}


// RÉCORD

function updateRecord() {

    if (score > record) {

        record = score;

        localStorage.setItem(
            "snakeRecord",
            record
        );

        document.getElementById("record").textContent =
            record;
    }

}


// COMPLETAR NIVEL

function completeLevel() {

    running = false;
    gameOver = true;

    clearInterval(gameInterval);
    clearInterval(obstacleInterval);

    // Si se ha completado el nivel 15,
    // se termina definitivamente la campaña.

    if (level === 15) {

        campaignComplete = true;

        localStorage.setItem(
            "snakeCampaignComplete",
            "true"
        );

        document.getElementById("message").innerHTML =
            "🏆 ¡ENHORABUENA!<br>" +
            "LOGRO DESBLOQUEADO<br>" +
            "¡Has completado los 15 niveles!";

    } else {

        // Desbloquear el siguiente nivel.
        const nextLevel = level + 1;

        localStorage.setItem(
            "snakeUnlockedLevel",
            String(nextLevel)
        );

        document.getElementById("message").innerHTML =
            "🎉 ¡NIVEL " + level + " COMPLETADO!<br>" +
            "Puntuación: " + score + "<br>" +
            "Pulsa «Nueva partida» para comenzar el nivel " +
            nextLevel + ".";

    }

    draw();

}


// PERDER PARTIDA

function endGame(message) {

    running = false;
    gameOver = true;

    clearInterval(gameInterval);
    clearInterval(obstacleInterval);

    document.getElementById("message").textContent =
        message + " Puntuación: " + score +
        ". Pulsa «Nueva partida» para volver a intentarlo.";

    // IMPORTANTE:
    // No se modifica el nivel desbloqueado.
    // Si pierdes, la próxima partida comienza
    // en el mismo nivel.

    draw();

}


// CREAR OBSTÁCULOS

function createObstacle() {

    const horizontal = Math.random() < 0.5;

    const length =
        3 + Math.floor(Math.random() * 4);

    const start = randomFreeCell();

    const cells = [];

    for (let i = 0; i < length; i++) {

        const cell = {
            x: start.x + (horizontal ? i : 0),
            y: start.y + (horizontal ? 0 : i)
        };

        if (
            cell.x >= SIZE ||
            cell.y >= SIZE ||
            isOccupied(cell)
        ) {
            return;
        }

        cells.push(cell);

    }

    // Duración aleatoria entre 5 y 8 segundos.
    const duration = 5000 + Math.random() * 3000;

    obstacles.push({
        cells: cells,
        expiresAt: Date.now() + duration
    });

}


// DIBUJAR JUEGO

function draw() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    // FONDO

    ctx.fillStyle = "#17232d";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    // CUADRÍCULA

    ctx.strokeStyle = "#243541";
    ctx.lineWidth = 1;

    for (let i = 0; i <= SIZE; i++) {

        ctx.beginPath();
        ctx.moveTo(i * CELL, 0);
        ctx.lineTo(i * CELL, canvas.height);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(0, i * CELL);
        ctx.lineTo(canvas.width, i * CELL);
        ctx.stroke();

    }

    // MANZANA

    if (food) {

        ctx.fillStyle = "#ff4141";

        ctx.beginPath();

        ctx.arc(
            food.x * CELL + CELL / 2,
            food.y * CELL + CELL / 2,
            CELL * 0.38,
            0,
            Math.PI * 2
        );

        ctx.fill();

        ctx.fillStyle = "#62e879";

        ctx.fillRect(
            food.x * CELL + CELL / 2 - 2,
            food.y * CELL + 2,
            4,
            7
        );

    }

    // MINAS

    mines.forEach(mine => {

        ctx.fillStyle = "#050505";

        ctx.beginPath();

        ctx.arc(
            mine.x * CELL + CELL / 2,
            mine.y * CELL + CELL / 2,
            CELL * 0.38,
            0,
            Math.PI * 2
        );

        ctx.fill();

        ctx.strokeStyle = "#777";
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.fillStyle = "white";
        ctx.font = "15px Arial";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        ctx.fillText(
            "✹",
            mine.x * CELL + CELL / 2,
            mine.y * CELL + CELL / 2
        );

    });

    // OBSTÁCULOS TEMPORALES

    obstacles.forEach(obstacle => {

        obstacle.cells.forEach(cell => {

            ctx.fillStyle = "#b15cff";

            ctx.fillRect(
                cell.x * CELL + 2,
                cell.y * CELL + 2,
                CELL - 4,
                CELL - 4
            );

        });

    });

    // SERPIENTE

    snake.forEach((part, index) => {

        ctx.fillStyle =
            index === 0 ? "#a0ffad" : "#39c85a";

        ctx.fillRect(
            part.x * CELL + 2,
            part.y * CELL + 2,
            CELL - 4,
            CELL - 4
        );

        ctx.strokeStyle = "#173c24";

        ctx.strokeRect(
            part.x * CELL + 2,
            part.y * CELL + 2,
            CELL - 4,
            CELL - 4
        );

    });

    // PANTALLA DE PAUSA

    if (paused) {

        ctx.fillStyle = "rgba(0,0,0,0.65)";

        ctx.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
        );

        ctx.fillStyle = "white";
        ctx.font = "bold 42px Arial";
        ctx.textAlign = "center";

        ctx.fillText(
            "PAUSA",
            canvas.width / 2,
            canvas.height / 2
        );

    }

}


// CONTROLES TÁCTILES

let touchStartX = 0;
let touchStartY = 0;

canvas.addEventListener("touchstart", function(event) {

    const touch = event.changedTouches[0];

    touchStartX = touch.clientX;
    touchStartY = touch.clientY;

}, { passive: true });


canvas.addEventListener("touchend", function(event) {

    const touch = event.changedTouches[0];

    const dx = touch.clientX - touchStartX;
    const dy = touch.clientY - touchStartY;

    if (
        Math.max(
            Math.abs(dx),
            Math.abs(dy)
        ) < 20
    ) {
        return;
    }

    if (Math.abs(dx) > Math.abs(dy)) {

        changeDirection(
            dx > 0 ? "right" : "left"
        );

    } else {

        changeDirection(
            dy > 0 ? "down" : "up"
        );

    }

}, { passive: true });


// PANTALLA INICIAL

snake = [
    { x: 10, y: 10 },
    { x: 9, y: 10 },
    { x: 8, y: 10 }
];

direction = "right";
nextDirection = "right";

food = { x: 14, y: 10 };

updateInterface();
draw();

if (campaignComplete) {

    document.getElementById("message").textContent =
        "🏆 ¡Has completado los 15 niveles! LOGRO DESBLOQUEADO";

} else {

    document.getElementById("message").textContent =
        "Pulsa «Nueva partida» para empezar el nivel " +
        level + ".";

}

</script>

</body>
</html>
