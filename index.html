<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake - Campaña de 15 niveles</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;padding:15px;background:#101820;color:white;
 font-family:Arial,sans-serif;text-align:center;
}
h1{color:#55ef83;margin:8px 0}
#game-container{max-width:620px;margin:auto}
#stats{
 display:flex;justify-content:space-around;flex-wrap:wrap;
 gap:8px;margin:12px 0;font-weight:bold
}
.stat{background:#253746;padding:9px 13px;border-radius:8px}
canvas{
 display:block;width:min(92vw,600px);height:min(92vw,600px);
 max-width:600px;max-height:600px;margin:12px auto;
 background:#17252e;border:3px solid #55ef83;border-radius:5px;
 touch-action:none
}
#message{
 min-height:48px;color:#ffe66d;font-weight:bold;
 font-size:18px;margin:10px
}
button{
 border:0;border-radius:9px;padding:12px 18px;
 margin:5px;background:#55ef83;color:#102018;
 font-weight:bold;font-size:15px;cursor:pointer
}
button:active{transform:scale(.96)}
.controls{
 display:grid;grid-template-columns:repeat(3,60px);
 justify-content:center;gap:6px;margin:12px auto
}
.controls button{margin:0;padding:13px 5px;font-size:20px}
.empty{visibility:hidden}
.small{font-size:13px;color:#c5d0d8}
</style>
</head>
<body>
<div id="game-container">
<h1>🐍 SNAKE</h1>

<div id="stats">
 <div class="stat">Nivel: <span id="level">1</span>/15</div>
 <div class="stat">Puntos: <span id="score">0</span>/50</div>
 <div class="stat">Récord: <span id="record">0</span></div>
</div>

<canvas id="game" width="600" height="600"></canvas>

<div id="message">Pulsa «Nueva partida» para comenzar</div>

<div>
 <button id="startBtn">Nueva partida</button>
 <button id="pauseBtn">Pausar</button>
</div>

<div class="controls">
 <button class="empty"> </button>
 <button data-dir="up">⬆️</button>
 <button class="empty"> </button>
 <button data-dir="left">⬅️</button>
 <button data-dir="down">⬇️</button>
 <button data-dir="right">➡️</button>
</div>

<p class="small">
 Controles: flechas o WASD. En móvil, utiliza los botones o desliza el dedo.
 Cada manzana suma 1 punto. Necesitas 50 puntos para superar cada nivel.
</p>
</div>

<script>
"use strict";

/* CONFIGURACIÓN */
const SIZE=20;
const CELL=30;
const INITIAL_SPEED=230;
const SPEED_INCREASE=3;
const MINIMUM_SPEED=150;
const SPEED_INCREASE_PER_5_POINTS=0.005;
const POINTS_TO_WIN=50;
const MAX_LEVEL=15;

/* ALMACENAMIENTO SEGURO */
function safeGet(key){
 try{return localStorage.getItem(key)}catch(e){return null}
}
function safeSet(key,value){
 try{localStorage.setItem(key,value)}catch(e){}
}

/* ELEMENTOS */
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const levelEl=document.getElementById("level");
const scoreEl=document.getElementById("score");
const recordEl=document.getElementById("record");
const messageEl=document.getElementById("message");
const startBtn=document.getElementById("startBtn");
const pauseBtn=document.getElementById("pauseBtn");

if(!ctx){
 messageEl.textContent="Error: no se pudo iniciar el canvas.";
 throw new Error("Canvas no disponible");
}

/* ESTADO */
let unlockedLevel=Math.max(1,Math.min(MAX_LEVEL,
 Number(safeGet("snakeUnlockedLevel"))||1));
let record=Number(safeGet("snakeRecord"))||0;
let campaignComplete=safeGet("snakeCampaignComplete")==="true";

let level=unlockedLevel;
let score=0;
let snake=[];
let food={x:10,y:10};
let mines=[];
let obstacles=[];
let direction={x:1,y:0};
let nextDirection={x:1,y:0};
let gameInterval=null;
let obstacleTimeout=null;
let running=false;
let paused=false;
let gameOver=false;
let won=false;
let touchStart=null;

/* UTILIDADES */
function randomCell(){
 return {x:Math.floor(Math.random()*SIZE),y:Math.floor(Math.random()*SIZE)};
}
function same(a,b){return a.x===b.x&&a.y===b.y}
function occupied(p){
 return snake.some(s=>same(s,p))||
 mines.some(m=>same(m,p))||
 obstacles.some(o=>same(o,p));
}
function placeFood(){
 let p,tries=0;
 do{
  p=randomCell();tries++;
 }while(occupied(p)&&tries<1000);
 food=p;
}
function speedForLevel(l){
 return Math.max(MINIMUM_SPEED,INITIAL_SPEED-((l-1)*SPEED_INCREASE));
}
function currentSpeed(){
 const boost=Math.floor(score/5);
 return Math.max(MINIMUM_SPEED,
 speedForLevel(level)/
 Math.pow(1+SPEED_INCREASE_PER_5_POINTS,boost));
}
function startGameInterval(){
 clearInterval(gameInterval);
 gameInterval=setInterval(gameLoop,currentSpeed());
}
function updateInterface(){
 levelEl.textContent=level;
 scoreEl.textContent=score;
 recordEl.textContent=record;
}

/* DIBUJO */
function draw(){
 ctx.clearRect(0,0,canvas.width,canvas.height);

 ctx.fillStyle="#17252e";
 ctx.fillRect(0,0,600,600);

 /* Cuadrícula */
 ctx.strokeStyle="rgba(255,255,255,.09)";
 ctx.lineWidth=1;
 for(let i=0;i<=SIZE;i++){
  ctx.beginPath();
  ctx.moveTo(i*CELL,0);
  ctx.lineTo(i*CELL,600);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(0,i*CELL);
  ctx.lineTo(600,i*CELL);
  ctx.stroke();
 }

 /* Obstáculos */
 for(const o of obstacles){
  ctx.fillStyle="#9b59b6";
  ctx.fillRect(o.x*CELL+2,o.y*CELL+2,CELL-4,CELL-4);
 }

 /* Minas */
 for(const m of mines){
  ctx.fillStyle="#050505";
  ctx.beginPath();
  ctx.arc(m.x*CELL+15,m.y*CELL+15,12,0,Math.PI*2);
  ctx.fill();
  ctx.strokeStyle="#777";
  ctx.lineWidth=2;
  ctx.stroke();
  ctx.strokeStyle="#ddd";
  ctx.beginPath();
  ctx.moveTo(m.x*CELL+15,m.y*CELL+2);
  ctx.lineTo(m.x*CELL+15,m.y*CELL-3);
  ctx.stroke();
 }

 /* Manzana */
 ctx.fillStyle="#ff3b30";
 ctx.beginPath();
 ctx.arc(food.x*CELL+15,food.y*CELL+16,11,0,Math.PI*2);
 ctx.fill();
 ctx.fillStyle="#65d46e";
 ctx.fillRect(food.x*CELL+15,food.y*CELL+2,4,8);

 /* Serpiente */
 snake.forEach((part,i)=>{
  ctx.fillStyle=i===0?"#a4ff83":"#55c878";
  ctx.fillRect(part.x*CELL+2,part.y*CELL+2,CELL-4,CELL-4);
  if(i===0){
   ctx.fillStyle="#102018";
   const ex=direction.x===1?22:direction.x===-1?8:15;
   const ey=direction.y===1?22:direction.y===-1?8:15;
   ctx.beginPath();ctx.arc(part.x*CELL+ex-4,part.y*CELL+ey-3,2,0,7);ctx.fill();
   ctx.beginPath();ctx.arc(part.x*CELL+ex+4,part.y*CELL+ey-3,2,0,7);ctx.fill();
  }
 });

 if(paused){
  overlay("PAUSA");
 }
 if(gameOver){
  overlay("FIN DE LA PARTIDA");
 }
 if(won){
  overlay("¡NIVEL COMPLETADO!");
 }
}
function overlay(text){
 ctx.fillStyle="rgba(0,0,0,.65)";
 ctx.fillRect(0,240,600,120);
 ctx.fillStyle="#fff";
 ctx.font="bold 34px Arial";
 ctx.textAlign="center";
 ctx.fillText(text,300,310);
}

/* MINAS Y OBSTÁCULOS */
function createMines(){
 mines=[];
 if(level<5)return;
 const count=Math.min(2+Math.floor((level-5)/2),8);
 for(let i=0;i<count;i++){
  let p=randomCell(),tries=0;
  while((occupied(p)||same(p,food))&&tries++<500)p=randomCell();
  if(!occupied(p)&&!same(p,food))mines.push(p);
 }
}
function createObstacles(){
 obstacles=[];
 if(level<10)return;
 const count=Math.min(3+Math.floor((level-10)/2),8);
 for(let i=0;i<count;i++){
  let p=randomCell(),tries=0;
  while((occupied(p)||same(p,food))&&tries++<500)p=randomCell();
  if(!occupied(p)&&!same(p,food))obstacles.push(p);
 }
 const duration=5000+Math.random()*3000;
 clearTimeout(obstacleTimeout);
 obstacleTimeout=setTimeout(()=>{
  obstacles=[];
  draw();
 },duration);
}

/* PARTIDA */
function startGame(){
 clearInterval(gameInterval);
 clearTimeout(obstacleTimeout);

 if(campaignComplete){
  level=MAX_LEVEL;
  messageEl.textContent="¡Campaña completada! Has desbloqueado todos los niveles.";
  updateInterface();
  draw();
  return;
 }

 level=unlockedLevel;
 score=0;
 snake=[
  {x:9,y:10},
  {x:8,y:10},
  {x:7,y:10}
 ];
 direction={x:1,y:0};
 nextDirection={x:1,y:0};
 mines=[];
 obstacles=[];
 running=true;
 paused=false;
 gameOver=false;
 won=false;

 createMines();
 placeFood();
 createObstacles();

 messageEl.textContent="¡Consigue 50 puntos para superar el nivel!";
 pauseBtn.textContent="Pausar";
 updateInterface();
 draw();
 startGameInterval();
}

function endGame(){
 clearInterval(gameInterval);
 clearTimeout(obstacleTimeout);
 running=false;
 paused=false;
 gameOver=true;
 messageEl.textContent="Has perdido. Pulsa Nueva partida para reintentar el nivel "+level+".";
 draw();
}

function completeLevel(){
 clearInterval(gameInterval);
 clearTimeout(obstacleTimeout);
 running=false;
 won=true;

 if(level>=MAX_LEVEL){
  campaignComplete=true;
  safeSet("snakeCampaignComplete","true");
  unlockedLevel=MAX_LEVEL;
  safeSet("snakeUnlockedLevel",unlockedLevel);
  messageEl.textContent="🏆 ¡LOGRO DESBLOQUEADO! ¡Has completado los 15 niveles!";
 }else{
  unlockedLevel=Math.max(unlockedLevel,level+1);
  safeSet("snakeUnlockedLevel",unlockedLevel);
  messageEl.textContent="¡Nivel "+level+" superado! Pulsa Nueva partida para comenzar el nivel "+unlockedLevel+".";
 }
 updateInterface();
 draw();
}

/* LÓGICA */
function gameLoop(){
 if(!running||paused||gameOver||won)return;

 direction=nextDirection;
 const head={
  x:snake[0].x+direction.x,
  y:snake[0].y+direction.y
 };

 /* Paredes */
 if(head.x<0||head.x>=SIZE||head.y<0||head.y>=SIZE){
  endGame();return;
 }

 const eating=same(head,food);
 const bodyToCheck=eating?snake:snake.slice(0,-1);

 if(bodyToCheck.some(p=>same(p,head))){
  endGame();return;
 }
 if(mines.some(m=>same(m,head))||
 obstacles.some(o=>same(o,head))){
  endGame();return;
 }

 snake.unshift(head);

 if(eating){
  score++;
  if(score>record){
   record=score;
   safeSet("snakeRecord",record);
  }
  updateInterface();

  if(score>=POINTS_TO_WIN){
   completeLevel();return;
  }

  placeFood();
  if(level>=10&&Math.random()<0.18)createObstacles();
 }else{
  snake.pop();
 }

 draw();

 /* Ajustar velocidad progresivamente */
 if(eating)startGameInterval();
}

/* CONTROLES */
function changeDirection(dir){
 if(!running||paused||gameOver||won)return;

 const dirs={
  up:{x:0,y:-1},
  down:{x:0,y:1},
  left:{x:-1,y:0},
  right:{x:1,y:0}
 };
 const d=dirs[dir];
 if(!d)return;

 if(d.x===-direction.x&&d.y===-direction.y)return;
 nextDirection=d;
}

document.addEventListener("keydown",e=>{
 const keys={
  ArrowUp:"up",w:"up",W:"up",
  ArrowDown:"down",s:"down",S:"down",
  ArrowLeft:"left",a:"left",A:"left",
  ArrowRight:"right",d:"right",D:"right"
 };
 if(keys[e.key]){
  e.preventDefault();
  changeDirection(keys[e.key]);
 }
});

document.querySelectorAll("[data-dir]").forEach(btn=>{
 btn.addEventListener("click",()=>{
  changeDirection(btn.dataset.dir);
 });
});

canvas.addEventListener("touchstart",e=>{
 const t=e.changedTouches[0];
 touchStart={x:t.clientX,y:t.clientY};
},{passive:true});

canvas.addEventListener("touchend",e=>{
 if(!touchStart)return;
 const t=e.changedTouches[0];
 const dx=t.clientX-touchStart.x;
 const dy=t.clientY-touchStart.y;
 if(Math.max(Math.abs(dx),Math.abs(dy))>20){
  if(Math.abs(dx)>Math.abs(dy)){
   changeDirection(dx>0?"right":"left");
  }else{
   changeDirection(dy>0?"down":"up");
  }
 }
 touchStart=null;
},{passive:true});

/* BOTONES */
startBtn.addEventListener("click",startGame);

pauseBtn.addEventListener("click",()=>{
 if(!running||gameOver||won)return;
 paused=!paused;
 pauseBtn.textContent=paused?"Reanudar":"Pausar";
 messageEl.textContent=paused?"Partida pausada":"¡Sigue jugando!";
 if(!paused)draw();
 else draw();
});

/* INICIO SEGURO: pinta el juego incluso antes de empezar */
function initialScreen(){
 level=unlockedLevel;
 score=0;
 snake=[
  {x:9,y:10},
  {x:8,y:10},
  {x:7,y:10}
 ];
 direction={x:1,y:0};
 nextDirection={x:1,y:0};
 mines=[];
 obstacles=[];
 placeFood();
 updateInterface();
 draw();
}

try{
 initialScreen();
 if(campaignComplete){
  messageEl.textContent="🏆 Campaña completada. ¡Enhorabuena!";
 }
}catch(error){
 messageEl.textContent="Error al iniciar: "+error.message;
 console.error(error);
}
</script>
</body>
</html>
