<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Snake - 15 Niveles</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #111827;
    font-family: Arial, sans-serif;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 15px;
}

.game-container {
    width: min(100%, 650px);
    text-align: center;
}

h1 {
    margin: 0 0 15px;
    font-size: clamp(24px, 6vw, 38px);
}

.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 12px;
}

.stat {
    background: #1f2937;
    padding: 10px 5px;
    border-radius: 10px;
    font-size: clamp(11px, 3vw, 16px);
}

.stat strong {
    display: block;
    margin-top: 4px;
    color: #4ade80;
    font-size: clamp(18px, 5vw, 25px);
}

.canvas-wrapper {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    background: black;
    border: 4px solid #4ade80;
    border-radius: 12px;
    overflow: hidden;
}

canvas {
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
}

/* MENSAJES */

#message {
    position: absolute;
    inset: 0;
    display: none;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    text-align: center;
    background: rgba(0,0,0,0.82);
    padding: 25px;
    z-index: 10;
}

#message h2 {
    margin: 0 0 15px;
    font-size: clamp(28px, 7vw, 48px);
}

#message p {
    margin: 0;
    font-size: clamp(16px, 4vw, 22px);
}

.achievement {
    color: #facc15;
    font-weight: bold;
    font-size: clamp(20px, 5vw, 30px);
    margin-top: 15px;
}

button {
    border: none;
    border-radius: 10px;
    padding: 13px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

#pauseBtn {
    width: 100%;
    margin-top: 12px;
    background: #facc15;
    color: #111;
}

#restartBtn {
    margin-top: 20px;
    background: #4ade80;
    color: #111;
}

/* CONTROLES PARA MÓVIL */

.mobile-controls {
    display: none;
    width: 230px;
    margin: 15px auto 0;
}

.control-row {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin: 10px 0;
}

.control-btn {
    width: 65px;
    height: 55px;
    padding: 0;
    font-size: 25px;
    background: #374151;
    color: white;
}

@media (max-width: 768px) {

    .mobile-controls {
        display: block;
    }

}

</style>
</head>

<body>

<div class="game-container">

    <h1>🐍 Snake: 15 Niveles</h1>

    <div class="stats">

        <div class="stat">
            PUNTUACIÓN
            <strong id="score">0</strong>
        </div>

        <div class="stat">
            RÉCORD
            <strong id="highScore">0</strong>
        </div>

        <div class="stat">
            NIVEL
            <strong id="level">1 / 15</strong>
        </div>

    </div>

    <div class="canvas-wrapper">

        <canvas id="gameCanvas"></canvas>

        <div id="message">

            <h2 id="messageTitle"></h2>

            <p id="messageText"></p>

            <div
                id="achievementText"
                class="achievement">
            </div>

            <button
                id="restartBtn"
                onclick="startGame()">

                Jugar de nuevo

            </button>

        </div>

    </div>

    <button id="pauseBtn">
        ⏸ Pausar
    </button>

    <div class="mobile-controls">

        <div class="control-row">

            <button
                class="control-btn"
                data-direction="UP">

                ▲

            </button>

        </div>

        <div class="control-row">

            <button
                class="control-btn"
                data-direction="LEFT">

                ◀

            </button>

            <button
                class="control-btn"
                data-direction="DOWN">

                ▼

            </button>

            <button
                class="control-btn"
                data-direction="RIGHT">

                ▶

            </button>

        </div>

    </div>

</div>

<script>

/* =====================================================
   CONFIGURACIÓN
===================================================== */

const canvas =
    document.getElementById("gameCanvas");

const ctx =
    canvas.getContext("2d");

const scoreElement =
    document.getElementById("score");

const highScoreElement =
    document.getElementById("highScore");

const levelElement =
    document.getElementById("level");

const pauseBtn =
    document.getElementById("pauseBtn");

const message =
    document.getElementById("message");

const messageTitle =
    document.getElementById("messageTitle");

const messageText =
    document.getElementById("messageText");

const achievementText =
    document.getElementById("achievementText");

/* TABLERO */

const GRID_SIZE = 20;

canvas.width = 600;
canvas.height = 600;

const TILE_COUNT = GRID_SIZE;

const TILE_SIZE =
    canvas.width / TILE_COUNT;

/* NIVELES */

const MAX_LEVEL = 15;

/* Cada 50 puntos se supera un nivel */

const POINTS_PER_LEVEL = 50;

/* =====================================================
   VARIABLES DEL JUEGO
===================================================== */

let snake;

let direction;
let nextDirection;

let apple;

let mines = [];
let walls = [];

let score = 0;
let level = 1;

let gameSpeed;

/*
   VELOCIDAD REDUCIDA A LA MITAD

   Número mayor = serpiente más lenta.

   Antes: 230 ms
   Ahora: 460 ms
*/

const INITIAL_SPEED = 460;

/*
   Antes: 6 ms por nivel
   Ahora: 3 ms por nivel

   La velocidad aumenta muy suavemente.
*/

const SPEED_INCREASE = 3;

/*
   La serpiente nunca será más rápida
   que este valor.
*/

const MINIMUM_SPEED = 300;

let gameInterval;

let paused = false;
let gameRunning = false;

let wallTimeout;

/* =====================================================
   RÉCORD
===================================================== */

let highScore =
    Number(
        localStorage.getItem(
            "snakeHighScore"
        )
    ) || 0;

highScoreElement.textContent =
    highScore;

/* =====================================================
   INICIAR JUEGO
===================================================== */

function startGame() {

    clearInterval(gameInterval);

    clearTimeout(wallTimeout);

    score = 0;
    level = 1;

    snake = [
        { x: 10, y: 10 },
        { x: 9, y: 10 },
        { x: 8, y: 10 }
    ];

    direction = "RIGHT";
    nextDirection = "RIGHT";

    mines = [];
    walls = [];

    paused = false;
    gameRunning = true;

    message.style.display = "none";

    pauseBtn.textContent =
        "⏸ Pausar";

    createApple();

    updateStats();

    updateSpeed();

    gameInterval =
        setInterval(
            gameLoop,
            gameSpeed
        );

    drawGame();
}

/* =====================================================
   BUCLE DEL JUEGO
===================================================== */

function gameLoop() {

    if (!gameRunning) return;

    if (paused) return;

    direction = nextDirection;

    moveSnake();

    if (!gameRunning) return;

    checkLevel();

    if (!gameRunning) return;

    drawGame();
}

/* =====================================================
   MOVIMIENTO
===================================================== */

function moveSnake() {

    const head =
        { ...snake[0] };

    if (direction === "UP") {
        head.y--;
    }

    if (direction === "DOWN") {
        head.y++;
    }

    if (direction === "LEFT") {
        head.x--;
    }

    if (direction === "RIGHT") {
        head.x++;
    }

    /* PAREDES EXTERIORES */

    if (
        head.x < 0 ||
        head.x >= TILE_COUNT ||
        head.y < 0 ||
        head.y >= TILE_COUNT
    ) {

        gameOver(
            "💥 ¡Has chocado contra el borde!"
        );

        return;
    }

    /*
       COLISIÓN CON LA SERPIENTE

       Se comprueba excluyendo la cola,
       porque la cola se mueve en cada turno.
    */

    for (let i = 0; i < snake.length - 1; i++) {

        const part = snake[i];

        if (
            head.x === part.x &&
            head.y === part.y
        ) {

            gameOver(
                "🐍 ¡Has chocado contigo mismo!"
            );

            return;
        }
    }

    /* COLISIÓN CON MINAS */

    for (const mine of mines) {

        if (
            head.x === mine.x &&
            head.y === mine.y
        ) {

            gameOver(
                "💣 ¡Has tocado una mina!"
            );

            return;
        }
    }

    /* COLISIÓN CON OBSTÁCULOS */

    for (const wall of walls) {

        if (
            head.x === wall.x &&
            head.y === wall.y
        ) {

            gameOver(
                "🚧 ¡Has chocado contra un obstáculo!"
            );

            return;
        }
    }

    snake.unshift(head);

    /* COMER MANZANA */

    if (
        head.x === apple.x &&
        head.y === apple.y
    ) {

        /*
           Cada manzana vale 1 punto
        */

        score += 1;

        /* ACTUALIZAR RÉCORD */

        if (score > highScore) {

            highScore = score;

            localStorage.setItem(
                "snakeHighScore",
                highScore
            );
        }

        createApple();

        createMineIfNeeded();

        createTemporaryWallsIfNeeded();

        updateStats();

    } else {

        snake.pop();
    }
}

/* =====================================================
   CREAR MANZANA
===================================================== */

function createApple() {

    let validPosition = false;

    while (!validPosition) {

        const position =
            randomPosition();

        if (
            !isOccupied(
                position.x,
                position.y
            )
        ) {

            apple = position;

            validPosition = true;
        }
    }
}

/* =====================================================
   MINAS
   DESDE EL NIVEL 5
===================================================== */

function createMineIfNeeded() {

    if (level < 5) return;

    /*
       Nivel 5-6: 1 mina
       Nivel 7-8: 2 minas
       Nivel 9-10: 3 minas
       ...
       Máximo: 6
    */

    const maxMines =
        Math.min(
            1 +
            Math.floor(
                (level - 5) / 2
            ),
            6
        );

    if (mines.length >= maxMines) return;

    let validPosition = false;

    while (!validPosition) {

        const mine =
            randomPosition();

        if (
            !isOccupied(
                mine.x,
                mine.y
            )
        ) {

            mines.push(mine);

            validPosition = true;
        }
    }
}

/* =====================================================
   OBSTÁCULOS TEMPORALES
   DESDE NIVEL 10
===================================================== */

function createTemporaryWallsIfNeeded() {

    if (level < 10) return;

    /*
       30% de probabilidad de aparición
       después de comer una manzana.
    */

    const probability = 0.30;

    if (
        Math.random() > probability
    ) return;

    createWall();

    /*
       Duración aleatoria:
       entre 5 y 8 segundos
    */

    const duration =
        5000 +
        Math.random() * 3000;

    clearTimeout(wallTimeout);

    wallTimeout =
        setTimeout(
            function() {

                walls = [];

                drawGame();

            },
            duration
        );
}

/* =====================================================
   CREAR TRAZADO
===================================================== */

function createWall() {

    walls = [];

    const horizontal =
        Math.random() < 0.5;

    /*
       Longitud moderada para
       mantener el juego jugable.
    */

    const length =
        3 +
        Math.floor(
            Math.random() * 4
        );

    let startX =
        Math.floor(
            Math.random() *
            TILE_COUNT
        );

    let startY =
        Math.floor(
            Math.random() *
            TILE_COUNT
        );

    for (
        let i = 0;
        i < length;
        i++
    ) {

        const x =
            horizontal
                ? startX + i
                : startX;

        const y =
            horizontal
                ? startY
                : startY + i;

        if (
            x >= 0 &&
            x < TILE_COUNT &&
            y >= 0 &&
            y < TILE_COUNT &&
            !isOccupied(x, y)
        ) {

            walls.push({ x, y });
        }
    }

    if (walls.length < 3) {
        walls = [];
    }
}

/* =====================================================
   POSICIÓN ALEATORIA
===================================================== */

function randomPosition() {

    return {
        x: Math.floor(
            Math.random() *
            TILE_COUNT
        ),
        y: Math.floor(
            Math.random() *
            TILE_COUNT
        )
    };
}

/* =====================================================
   ¿ESTÁ OCUPADA UNA CASILLA?
===================================================== */

function isOccupied(x, y) {

    /* SERPIENTE */

    for (const part of snake) {

        if (
            part.x === x &&
            part.y === y
        ) {
            return true;
        }
    }

    /* MANZANA */

    if (
        apple &&
        apple.x === x &&
        apple.y === y
    ) {
        return true;
    }

    /* MINAS */

    for (const mine of mines) {

        if (
            mine.x === x &&
            mine.y === y
        ) {
            return true;
        }
    }

    /* OBSTÁCULOS */

    for (const wall of walls) {

        if (
            wall.x === x &&
            wall.y === y
        ) {
            return true;
        }
    }

    return false;
}

/* =====================================================
   COMPROBAR NIVEL
===================================================== */

function checkLevel() {

    /*
       Si llega a 750 puntos,
       se completa el juego.
    */

    if (
        score >=
        MAX_LEVEL * POINTS_PER_LEVEL
    ) {

        completeGame();

        return;
    }

    /*
       0-49 = Nivel 1
       50-99 = Nivel 2
       etc.
    */

    const calculatedLevel =
        Math.floor(
            score / POINTS_PER_LEVEL
        ) + 1;

    const newLevel =
        Math.min(
            calculatedLevel,
            MAX_LEVEL
        );

    if (newLevel > level) {

        level = newLevel;

        levelUp();
    }
}

/* =====================================================
   SUBIR DE NIVEL
===================================================== */

function levelUp() {

    updateSpeed();

    showTemporaryMessage(
        "⬆️ ¡Nivel " +
        level +
        "!",
        "La dificultad aumenta poco a poco."
    );

    updateStats();
}

/* =====================================================
   VELOCIDAD
===================================================== */

function updateSpeed() {

    /*
       VELOCIDAD REDUCIDA

       Nivel 1: 460 ms
       Nivel 2: 457 ms
       Nivel 3: 454 ms
       ...

       La diferencia entre niveles
       es ahora mucho más suave.
    */

    gameSpeed =
        Math.max(
            MINIMUM_SPEED,
            INITIAL_SPEED -
            (
                (level - 1) *
                SPEED_INCREASE
            )
        );

    if (gameRunning) {

        clearInterval(gameInterval);

        gameInterval =
            setInterval(
                gameLoop,
                gameSpeed
            );
    }
}

/* =====================================================
   MENSAJE TEMPORAL
===================================================== */

function showTemporaryMessage(
    title,
    text
) {

    /*
       El juego se pausa brevemente
       durante el mensaje de nivel.
    */

    const wasPaused = paused;

    paused = true;

    messageTitle.textContent =
        title;

    messageText.textContent =
        text;

    achievementText.textContent =
        "";

    document
        .getElementById(
            "restartBtn"
        )
        .style.display =
        "none";

    message.style.display =
        "flex";

    setTimeout(
        function() {

            if (
                gameRunning &&
                !wasPaused
            ) {

                paused = false;

                message.style.display =
                    "none";
            }

        },
        1200
    );
}

/* =====================================================
   COMPLETAR JUEGO
===================================================== */

function completeGame() {

    gameRunning = false;

    paused = false;

    clearInterval(
        gameInterval
    );

    clearTimeout(
        wallTimeout
    );

    messageTitle.textContent =
        "🏆 ¡FELICIDADES!";

    messageText.textContent =
        "¡Has completado los 15 niveles y terminado el juego!";

    achievementText.textContent =
        "🎉 LOGRO DESBLOQUEADO 🎉";

    document
        .getElementById(
            "restartBtn"
        )
        .style.display =
        "block";

    message.style.display =
        "flex";
}

/* =====================================================
   GAME OVER
===================================================== */

function gameOver(reason) {

    gameRunning = false;

    paused = false;

    clearInterval(
        gameInterval
    );

    clearTimeout(
        wallTimeout
    );

    messageTitle.textContent =
        "GAME OVER";

    messageText.textContent =
        reason +
        " Puntuación final: " +
        score;

    achievementText.textContent =
        "";

    document
        .getElementById(
            "restartBtn"
        )
        .style.display =
        "block";

    message.style.display =
        "flex";
}

/* =====================================================
   DIBUJAR JUEGO
===================================================== */

function drawGame() {

    /* FONDO */

    ctx.fillStyle = "#050505";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    /* CUADRÍCULA */

    ctx.strokeStyle =
        "rgba(255,255,255,0.04)";

    for (
        let i = 0;
        i <= TILE_COUNT;
        i++
    ) {

        ctx.beginPath();

        ctx.moveTo(
            i * TILE_SIZE,
            0
        );

        ctx.lineTo(
            i * TILE_SIZE,
            canvas.height
        );

        ctx.stroke();

        ctx.beginPath();

        ctx.moveTo(
            0,
            i * TILE_SIZE
        );

        ctx.lineTo(
            canvas.width,
            i * TILE_SIZE
        );

        ctx.stroke();
    }

    /* MANZANA */

    ctx.fillStyle = "#ef4444";

    ctx.beginPath();

    ctx.arc(
        apple.x * TILE_SIZE +
        TILE_SIZE / 2,

        apple.y * TILE_SIZE +
        TILE_SIZE / 2,

        TILE_SIZE * 0.35,

        0,

        Math.PI * 2
    );

    ctx.fill();

    /* MINAS */

    for (const mine of mines) {

        ctx.fillStyle = "#000000";

        ctx.beginPath();

        ctx.arc(
            mine.x * TILE_SIZE +
            TILE_SIZE / 2,

            mine.y * TILE_SIZE +
            TILE_SIZE / 2,

            TILE_SIZE * 0.35,

            0,

            Math.PI * 2
        );

        ctx.fill();

        ctx.strokeStyle = "#777";

        ctx.stroke();
    }

    /* OBSTÁCULOS */

    for (const wall of walls) {

        ctx.fillStyle = "#6b7280";

        ctx.fillRect(
            wall.x * TILE_SIZE + 2,
            wall.y * TILE_SIZE + 2,
            TILE_SIZE - 4,
            TILE_SIZE - 4
        );
    }

    /* SERPIENTE */

    snake.forEach(
        function(part, index) {

            ctx.fillStyle =
                index === 0
                    ? "#22c55e"
                    : "#4ade80";

            ctx.fillRect(
                part.x * TILE_SIZE + 2,
                part.y * TILE_SIZE + 2,
                TILE_SIZE - 4,
                TILE_SIZE - 4
            );
        }
    );

    /* CABEZA CON OJOS */

    const head = snake[0];

    const centerX =
        head.x * TILE_SIZE +
        TILE_SIZE / 2;

    const centerY =
        head.y * TILE_SIZE +
        TILE_SIZE / 2;

    ctx.fillStyle = "#111";

    const eyeSize =
        TILE_SIZE * 0.12;

    if (
        direction === "LEFT" ||
        direction === "RIGHT"
    ) {

        const eyeX =
            direction === "RIGHT"
                ? centerX + TILE_SIZE * 0.18
                : centerX - TILE_SIZE * 0.30;

        ctx.fillRect(
            eyeX,
            centerY - TILE_SIZE * 0.18,
            eyeSize,
            eyeSize
        );

        ctx.fillRect(
            eyeX,
            centerY + TILE_SIZE * 0.08,
            eyeSize,
            eyeSize
        );

    } else {

        const eyeY =
            direction === "DOWN"
                ? centerY + TILE_SIZE * 0.18
                : centerY - TILE_SIZE * 0.30;

        ctx.fillRect(
            centerX - TILE_SIZE * 0.18,
            eyeY,
            eyeSize,
            eyeSize
        );

        ctx.fillRect(
            centerX + TILE_SIZE * 0.08,
            eyeY,
            eyeSize,
            eyeSize
        );
    }
}

/* =====================================================
   ESTADÍSTICAS
===================================================== */

function updateStats() {

    scoreElement.textContent =
        score;

    highScoreElement.textContent =
        highScore;

    levelElement.textContent =
        level +
        " / " +
        MAX_LEVEL;
}

/* =====================================================
   TECLADO
===================================================== */

document.addEventListener(
    "keydown",
    function(event) {

        if (!gameRunning) return;

        /*
           Evita que las flechas
           desplacen la página.
        */

        if (
            [
                "ArrowUp",
                "ArrowDown",
                "ArrowLeft",
                "ArrowRight",
                " "
            ].includes(event.key)
        ) {
            event.preventDefault();
        }

        if (
            event.key === "ArrowUp" ||
            event.key === "w" ||
            event.key === "W"
        ) {
            changeDirection("UP");
        }

        if (
            event.key === "ArrowDown" ||
            event.key === "s" ||
            event.key === "S"
        ) {
            changeDirection("DOWN");
        }

        if (
            event.key === "ArrowLeft" ||
            event.key === "a" ||
            event.key === "A"
        ) {
            changeDirection("LEFT");
        }

        if (
            event.key === "ArrowRight" ||
            event.key === "d" ||
            event.key === "D"
        ) {
            changeDirection("RIGHT");
        }

        if (
            event.key === " " ||
            event.key === "p" ||
            event.key === "P"
        ) {
            togglePause();
        }
    }
);

/* =====================================================
   CAMBIAR DIRECCIÓN
===================================================== */

function changeDirection(
    newDirection
) {

    /*
       Evita girar directamente
       hacia atrás.
    */

    if (
        direction === "UP" &&
        newDirection === "DOWN"
    ) return;

    if (
        direction === "DOWN" &&
        newDirection === "UP"
    ) return;

    if (
        direction === "LEFT" &&
        newDirection === "RIGHT"
    ) return;

    if (
        direction === "RIGHT" &&
        newDirection === "LEFT"
    ) return;

    nextDirection =
        newDirection;
}

/* =====================================================
   BOTONES MÓVIL
===================================================== */

document
    .querySelectorAll(
        ".control-btn"
    )
    .forEach(
        function(button) {

            button.addEventListener(
                "click",
                function() {

                    changeDirection(
                        button.dataset.direction
                    );
                }
            );
        }
    );

/* =====================================================
   GESTOS TÁCTILES
===================================================== */

let touchStartX = 0;
let touchStartY = 0;

canvas.addEventListener(
    "touchstart",
    function(event) {

        const touch =
            event.changedTouches[0];

        touchStartX =
            touch.clientX;

        touchStartY =
            touch.clientY;
    },
    {
        passive: true
    }
);

canvas.addEventListener(
    "touchend",
    function(event) {

        const touch =
            event.changedTouches[0];

        const diffX =
            touch.clientX -
            touchStartX;

        const diffY =
            touch.clientY -
            touchStartY;

        /*
           Se requiere un movimiento
           mínimo para cambiar dirección.
        */

        if (
            Math.abs(diffX) <
            20 &&
            Math.abs(diffY) <
            20
        ) return;

        if (
            Math.abs(diffX) >
            Math.abs(diffY)
        ) {

            if (diffX > 0) {

                changeDirection(
                    "RIGHT"
                );

            } else {

                changeDirection(
                    "LEFT"
                );
            }

        } else {

            if (diffY > 0) {

                changeDirection(
                    "DOWN"
                );

            } else {

                changeDirection(
                    "UP"
                );
            }
        }
    },
    {
        passive: true
    }
);

/* =====================================================
   PAUSA
===================================================== */

pauseBtn.addEventListener(
    "click",
    togglePause
);

function togglePause() {

    if (!gameRunning) return;

    paused = !paused;

    if (paused) {

        pauseBtn.textContent =
            "▶ Reanudar";

        messageTitle.textContent =
            "⏸ JUEGO PAUSADO";

        messageText.textContent =
            "Pulsa Reanudar para continuar.";

        achievementText.textContent =
            "";

        document
            .getElementById(
                "restartBtn"
            )
            .style.display =
            "none";

        message.style.display =
            "flex";

    } else {

        pauseBtn.textContent =
            "⏸ Pausar";

        message.style.display =
            "none";
    }
}

/* =====================================================
   INICIAR JUEGO
===================================================== */

startGame();

</script>
